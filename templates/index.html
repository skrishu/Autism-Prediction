<!DOCTYPE html>
<html >
<!--From https://codepen.io/frytyler/pen/EGdtg-->
<head>
  <meta charset="UTF-8">
  <title>ML API</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
  
</head>

<body>
 <div class="login">
	<h1>Autism Prediction</h1>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/images/ASD.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        h1 {
            text-align: center;
            color: hsl(33, 91%, 47%);
        }
    </style>

     <!-- Main Input For Receiving Query to our ML -->
     <form action="/predict" method="post">
        <label for="result">Score for AQ(1-10) screening test:</label>
        <input type="text" id="result" name="result"><br><br>
    
        <label for="A3_Score">Score based on Autism Spectrum Quotient (AQ) numbered 3 from the screening tool (0 or 1):</label>
        <input type="text" id="A3_Score" name="A3_Score"><br><br>

        <label for="A4_Score">Score based on Autism Spectrum Quotient (AQ) numbered 4 from the screening tool (0 or 1):</label>
        <input type="text" id="A4_Score" name="A4_Score"><br><br>

        <label for="A5_Score">Score based on Autism Spectrum Quotient (AQ) numbered 5 from the screening tool (0 or 1):</label>
        <input type="text" id="A5_Score" name="A5_Score"><br><br>

        <label for="A6_Score">Score based on Autism Spectrum Quotient (AQ) numbered 6 from the screening tool (0 or 1):</label>
        <input type="text" id="A6_Score" name="A6_Score"><br><br>
    
        <label for="age">Age:</label>
        <input type="text" id="age" name="age"><br><br>
    
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="" selected disabled hidden>Select any country</option>
            <option value="Afghanistan">Afghanistan</option>
            <option value="American Samoa">American Samoa</option>
            <option value="Argentina">Argentina</option>
            <option value="Armenia">Armenia</option>
            <option value="Aruba">Aruba</option>
            <option value="Australia">Australia</option>
            <option value="Austria">Austria</option>
            <option value="Azerbaijan">Azerbaijan</option>
            <option value="Bahamas">Bahamas</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="Belgium">Belgium</option>
            <option value="Bolivia">Bolivia</option>
            <option value="Brazil">Brazil</option>
            <option value="Burundi">Burundi</option>
            <option value="Canada">Canada</option>
            <option value="China">China</option>
            <option value="Czech Republic">Czech Republic</option>
            <option value="Cyprus">Cyprus</option>
            <option value="Egypt">Egypt</option>
            <option value="Ethiopia">Ethiopia</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
            <option value="Hong Kong">Hong Kong</option>
            <option value="India">India</option>
            <option value="Iceland">Iceland</option>
            <option value="Iran">Iran</option>
            <option value="Iraq">Iraq</option>
            <option value="Ireland">Ireland</option>
            <option value="Italy">Italy</option>
            <option value="Japan">Japan</option>
            <option value="Jordan">Jordan</option>
            <option value="Kazakhstan">Kazakhstan</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Mexico">Mexico</option>
            <option value="Netherlands">Netherlands</option>
            <option value="New Zealand">New Zealand</option>
            <option value="Nicaragua">Nicaragua</option>
            <option value="Niger">Niger</option>
            <option value="Oman">Oman</option>
            <option value="Pakistan">Pakistan</option>
            <option value="Romania">Romania</option>
            <option value="Russia">Russia</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="Serbia">Serbia</option>
            <option value="Sierra Leone">Sierra Leone</option>
            <option value="South Africa">South Africa</option>
            <option value="Spain">Spain</option>
            <option value="Sri Lanka">Sri Lanka</option>
            <option value="Sweden">Sweden</option>
            <option value="Tonga">Tonga</option>
            <option value="Turkey">Turkey</option>
            <option value="Ukraine">Ukraine</option>
            <option value="United Arab Emirates">United Arab Emirates</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
            <option value="Viet Nam">Viet Nam</option>
            <option value="Burundi">Burundi</option>
            
        </select><br><br>
    
        <label for="ethnicity">Ethnicity:</label>
        <select id="ethnicity" name="ethnicity">
            <option value="" selected disabled hidden>Select any ethnicity</option>
            <option value="Asian">Asian</option>
            <option value="Black">Black</option>
            <option value="Hispanic">Hispanic</option>
            <option value="Latino">Latino</option>
            <option value="Middle Eastern">Middle Eastern</option>
            <option value="Pasifika">Pasifika</option>
            <option value="South Asian">South Asian</option>
            <option value="Turkish">Turkish</option>
            <option value="White-European">White-European</option>
            <option value="Others">Others</option>

        </select><br><br>
    
        <button type="submit">Predict</button>
    </form>
    
    
    
   <br>
   <br>
   {{ prediction_text }}
   {{ prediction_text | safe }}

 </div>


</body>
</html>

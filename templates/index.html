<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Autism Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Arimo" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Hind:300" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300" rel="stylesheet" type="text/css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/images/ASD.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
            width: 150px;
            /* Adjust the width based on your preference */
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        h1 {
            text-align: center;
            color: hsl(33, 91%, 47%);
        }
    </style>

</head>

<body>
    <div class="login">
        <h1>Autism Prediction</h1>
        <!-- Main Input For Receiving Query to our ML -->
        <form action="/predict" method="post">
            <!-- A1 to A3 scores -->
            <label for="A1_Score">A1 Score:</label><br>
            <input type="radio" id="A1_Score_0" name="A1_Score" value="0" required>
            <label for="A1_Score_0">0</label>
            <input type="radio" id="A1_Score_1" name="A1_Score" value="1" required>
            <label for="A1_Score_1">1</label><br>

            <!-- Repeat similar fields for A2 to A3 -->
            <label for="A2_Score">A2 Score:</label><br>
            <input type="radio" id="A2_Score_0" name="A2_Score" value="0" required>
            <label for="A2_Score_0">0</label>
            <input type="radio" id="A2_Score_1" name="A2_Score" value="1" required>
            <label for="A2_Score_1">1</label><br>

            <label for="A3_Score">A3 Score:</label><br>
            <input type="radio" id="A3_Score_0" name="A3_Score" value="0" required>
            <label for="A3_Score_0">0</label>
            <input type="radio" id="A3_Score_1" name="A3_Score" value="1" required>
            <label for="A3_Score_1">1</label><br>

            <!-- Input fields for other features -->
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required><br>

            <label for="austim">Austim:</label>
            <select id="austim" name="austim" required>
                <option value="">Select Austim</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select><br>
            <input type="hidden" id="austim_encoded" name="austim_encoded">

            <!-- Country -->
            <label for="country">Country:</label><br>
            <select id="country" name="country" required>
                <option value="" selected disabled hidden>Select any country</option>
                <option value="" selected disabled hidden>Select any country</option>
                <option value="Afghanistan">Afghanistan</option>
                <option value="American Samoa">American Samoa</option>
                <option value="Argentina">Argentina</option>
                <option value="Armenia">Armenia</option>
                <option value="Aruba">Aruba</option>
                <option value="Australia">Australia</option>
                <option value="Austria">Austria</option>
                <option value="Azerbaijan">Azerbaijan</option>
                <option value="Bahamas">Bahamas</option>
                <option value="Bangladesh">Bangladesh</option>
                <option value="Belgium">Belgium</option>
                <option value="Bolivia">Bolivia</option>
                <option value="Brazil">Brazil</option>
                <option value="Burundi">Burundi</option>
                <option value="Canada">Canada</option>
                <option value="China">China</option>
                <option value="Czech Republic">Czech Republic</option>
                <option value="Cyprus">Cyprus</option>
                <option value="Egypt">Egypt</option>
                <option value="Ethiopia">Ethiopia</option>
                <option value="France">France</option>
                <option value="Germany">Germany</option>
                <option value="Hong Kong">Hong Kong</option>
                <option value="India">India</option>
                <option value="Iceland">Iceland</option>
                <option value="Iran">Iran</option>
                <option value="Iraq">Iraq</option>
                <option value="Ireland">Ireland</option>
                <option value="Italy">Italy</option>
                <option value="Japan">Japan</option>
                <option value="Jordan">Jordan</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="Malaysia">Malaysia</option>
                <option value="Mexico">Mexico</option>
                <option value="Netherlands">Netherlands</option>
                <option value="New Zealand">New Zealand</option>
                <option value="Nicaragua">Nicaragua</option>
                <option value="Niger">Niger</option>
                <option value="Oman">Oman</option>
                <option value="Pakistan">Pakistan</option>
                <option value="Romania">Romania</option>
                <option value="Russia">Russia</option>
                <option value="Saudi Arabia">Saudi Arabia</option>
                <option value="Serbia">Serbia</option>
                <option value="Sierra Leone">Sierra Leone</option>
                <option value="South Africa">South Africa</option>
                <option value="Spain">Spain</option>
                <option value="Sri Lanka">Sri Lanka</option>
                <option value="Sweden">Sweden</option>
                <option value="Tonga">Tonga</option>
                <option value="Turkey">Turkey</option>
                <option value="Ukraine">Ukraine</option>
                <option value="United Arab Emirates">United Arab Emirates</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="United States">United States</option>
                <option value="Viet Nam">Viet Nam</option>
                <option value="Burundi">Burundi</option>

            </select><br><br>

            <!-- Gender -->
            <label for="gender">Gender:</label><br>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select><br>

            <!-- Submit button -->
            <input type="submit" value="Predict">
        </form>

        <br>
        <br>
        {{ prediction_text }}
        {{ prediction_text | safe }}

    </div>
</body>

</html>
